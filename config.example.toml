# PM Skill Configuration Example
# Copy to ~/.config/pm-skill/config.toml or .pm-skill.toml in project root

# ============================================================
# Directory Configuration
# ============================================================

# Directory for original imported documents (Markdown format)
raw_dir = "./knowledge-base/raw"

# Directory for compiled wiki knowledge
wiki_dir = "./knowledge-base/wiki"

# Directory for processing logs
log_dir = "./knowledge-base/log"

# SQLite database for document metadata and search index
index_db = "./knowledge-base/index.db"

# ============================================================
# LLM Configuration
# ============================================================

[llm]
# Model for knowledge compilation and PRD generation
# Options: claude-sonnet-4-6-20250528, claude-opus-4-5-20250915, claude-haiku-4-5-20251001
model = "claude-sonnet-4-6-20250528"

# Environment variable name containing API key
# Set ANTHROPIC_API_KEY=<your-key> in your shell
api_key_env = "ANTHROPIC_API_KEY"

# Base URL for API (optional, for proxies)
# base_url = "https://api.anthropic.com"

# ============================================================
# Import Configuration
# ============================================================

[import]
# Enable validation after conversion
validation_enabled = true

# Maximum file size in MB
max_file_size_mb = 50

# Supported formats (auto-detected, but can be restricted)
# formats = ["pdf", "docx", "html"]

# ============================================================
# Compilation Configuration
# ============================================================

[compilation]
# Include confidence annotations in wiki output
include_confidence = true

# Confidence levels: EXTRACTED, INFERRED, AMBIGUOUS, UNVERIFIED
default_confidence = "EXTRACTED"

# ============================================================
# PRD Configuration
# ============================================================

[prd]
# Default PRD template type
# Options: toc, tob, backend, mini-program
default_template = "toc"

# Output directory for generated PRDs
output_dir = "./prd-output"
